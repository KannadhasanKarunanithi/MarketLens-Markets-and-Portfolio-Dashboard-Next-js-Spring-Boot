spring:
  application:
    name: marketlens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/marketlens}
    username: ${DB_USERNAME:marketlens}
    password: ${DB_PASSWORD:marketlens}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

marketlens:
  version: ${APP_VERSION:dev}
  cors:
    allowed-origins: http://localhost:3000
