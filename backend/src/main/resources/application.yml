spring:
  application:
    name: marketlens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/marketlens}
    username: ${DB_USERNAME:marketlens}
    password: ${DB_PASSWORD:marketlens}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

marketlens:
  version: ${APP_VERSION:dev}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-must-be-long-enough-for-hs512-signing}
      issuer: marketlens
      access-token-ttl: 15m
      refresh-token-ttl: 7d
  bootstrap:
    admin:
      username: admin
      display-name: Site Administrator
      password: ${ADMIN_PASSWORD:admin12345}
    demo:
      username: demo
      display-name: Demo Investor
      password: ${DEMO_PASSWORD:demo12345}
    demo-enabled: true
  marketdata:
    provider: simulated
    seed-days: 220
    tick-interval: 15s

logging:
  level:
    org.flywaydb: info
