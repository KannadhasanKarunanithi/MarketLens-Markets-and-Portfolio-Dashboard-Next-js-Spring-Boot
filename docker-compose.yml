# Local PostgreSQL for development. Start with:
#   docker compose up -d
# Adminer is on http://localhost:8082

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketlens
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: marketlens
    ports:
      - "5435:5432"
    volumes:
      - marketlens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketlens -d marketlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  marketlens-db:
